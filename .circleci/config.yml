version: 2.1
jobs:
  build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run: echo "hellooooo"
  rspec:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run: echo "Rspec"
  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run: echo "deploy"
workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build
      - rspec
      - approval-deploy:
          type: approval
          requires:
            - rspec
          when:
            not:
              matches:
                pattern: ".*\\[skip-approval\\].*"
                value: << pipeline.trigger_parameters.github_app.commit_title >>
      - deploy:
          requires:
            - approval-deploy
